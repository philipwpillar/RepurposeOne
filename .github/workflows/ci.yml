name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Shallow checkout has no origin/main ref; the floor hex gate needs it as a baseline.
      - name: Fetch main for AC baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Acceptance criteria (floor)
        run: bash scripts/ac-check.sh floor

      - name: Acceptance criteria (phase)
        run: bash scripts/ac-check.sh 2

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (functional)
        run: npx playwright test
        env:
          CI: true
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
